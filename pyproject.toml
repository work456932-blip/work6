[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsdvq"
version = "0.1.0"
description = "Anonymous manuscript-based GSD-VQ implementation"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "Pillow>=9", "PyYAML>=6"]

[project.scripts]
gsdvq = "gsdvq.cli:main"

[tool.setuptools.packages.find]
include = ["gsdvq*"]
